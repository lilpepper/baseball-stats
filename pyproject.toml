[project]
name = "baseball-stats"
version = "0.1.0"
description = "Interactive baseball statistics explorer with sliders, custom stats, and LLM integration"
requires-python = ">=3.9"
readme = "README.md"

dependencies = [
    # Web Framework
    "dash>=2.14.0",
    "dash-bootstrap-components>=1.5.0",
    "dash-daq>=0.5.0",

    # Data Processing
    "pandas>=2.1.0",
    "numpy>=1.25.0",
    "pybaseball>=2.2.7",
    "duckdb>=0.9.0",
    "pyarrow>=14.0.0",

    # Visualization
    "plotly>=5.18.0",

    # LLM Integration
    "langchain>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-experimental>=0.0.47",

    # Utilities
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-dash>=2.7.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "ruff>=0.1.6",
]

[project.scripts]
baseball-stats = "baseball_stats.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baseball_stats"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_ignores = true
